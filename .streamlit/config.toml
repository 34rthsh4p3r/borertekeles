[theme]
base = "light"
primaryColor = "#762C47"
backgroundColor = "#F8F5EF"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#30232B"
font = "sans-serif"
headingFont = "sans-serif"
baseRadius = "0.65rem"
borderColor = "#DFD6D0"
showWidgetBorder = true

[client]
showErrorDetails = "none"
toolbarMode = "minimal"

[browser]
gatherUsageStats = false
